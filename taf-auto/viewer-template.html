<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牛検索（TAF）</title>
<style>
:root{
 --bg:#EFF3EE; --card:#FFFFFF; --ink:#1C2B23; --muted:#61705F; --line:#DCE3DA;
 --green:#1E5B40; --green-soft:#E4EEE4; --amber:#B86E12; --amber-soft:#FCF1E2; --red:#B3372F; --red-soft:#FBEAEA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Yu Gothic UI","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
header{background:var(--green);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:800;letter-spacing:.04em}
header .fresh{font-size:13px;opacity:.9}
header .fresh.old{background:var(--amber-soft);color:var(--amber);padding:3px 10px;border-radius:999px;font-weight:700;opacity:1}
main{max-width:1100px;margin:0 auto;padding:18px 20px 40px}
.search{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
#q{font-size:40px;font-weight:800;letter-spacing:.2em;width:260px;padding:8px 16px;border:3px solid var(--green);border-radius:14px;background:#fff;font-variant-numeric:tabular-nums}
#q:focus{outline:none;box-shadow:0 0 0 4px rgba(30,91,64,.2)}
select{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.hint{color:var(--muted);font-size:13px}
.count{color:var(--muted);font-size:14px;margin:4px 0 10px}
.list{display:grid;gap:12px}
.cow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(21,44,32,.06)}
.cow-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.ear{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.ear .dim{color:#A3B0A2;font-size:20px}
.ear .key{background:#FFF3B8;border-radius:6px;padding:0 4px}
.name{font-size:17px;font-weight:700}
.farm{margin-left:auto;background:var(--green-soft);color:var(--green);font-weight:800;padding:4px 12px;border-radius:999px;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:#EEF1ED;color:#3E4C3F}
.tag.preg{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.new{background:#E3EDFB;color:#1F4E8C}
.tag.bad{background:var(--red-soft);color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px}
.f{display:flex;flex-direction:column;border-left:3px solid var(--line);padding-left:10px}
.f .k{font-size:12px;color:var(--muted);font-weight:700}
.f .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all}
.f .v small{font-size:12px;color:var(--muted);font-weight:700;margin-left:4px}
details{margin-top:12px}
summary{cursor:pointer;color:var(--green);font-size:13px;font-weight:700}
table{border-collapse:collapse;margin-top:8px;font-size:13px}
td{border-bottom:1px solid var(--line);padding:3px 12px 3px 0;vertical-align:top}
td:first-child{color:var(--muted);white-space:nowrap}
.cands{display:grid;gap:10px}
.cand{display:grid;grid-template-columns:minmax(150px,auto) auto 1fr;align-items:center;gap:6px 18px;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer}
.cand:hover,.cand:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 4px rgba(30,91,64,.12)}
.cand-farm{font-size:20px;font-weight:800;color:var(--green)}
.cand-ear{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.cand-ear .dim{font-size:16px}
.cand-sub{font-size:14px;color:var(--muted);font-weight:700}
.cand .tags{grid-column:1/-1;margin:0}
.back{font:inherit;font-size:15px;font-weight:800;color:var(--green);background:var(--green-soft);border:none;border-radius:10px;padding:8px 14px;cursor:pointer}
.picker{text-align:left;line-height:1.8}
.pick{display:inline-block;margin-top:10px;background:var(--green);color:#fff;font-weight:800;border-radius:12px;padding:10px 20px;cursor:pointer}
.empty{background:var(--card);border:1px dashed #C0D0C0;border-radius:16px;padding:30px;text-align:center;color:var(--muted);font-size:15px}
.farms{margin-top:28px;font-size:13px;color:var(--muted)}
.farms summary{font-size:13px}
.farms table td{padding-right:18px}
</style>
</head>
<body>
<header>
  <h1>牛検索（TAF 在籍牛一覧）</h1>
  <span class="fresh" id="fresh"></span>
</header>
<main>
  <div class="search">
    <input id="q" inputmode="numeric" autocomplete="off" placeholder="0000" autofocus aria-label="耳標の4桁">
    <select id="farmSel" aria-label="農家で絞る"><option value="">全農家</option></select>
    <span class="hint">耳標の4桁（例：0722）を入れるとすぐ出ます。<br>10桁ぜんぶ・名号の一部でも探せます。</span>
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <details class="farms" id="farms"></details>
</main>
<script>
// 取り込んだデータ（build-viewer.mjs が作るときに入れる）
var DATA = /*__DATA__*/null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function digits(s){ return String(s||'').replace(/\D/g,''); }

// 画面に出ている牛番号（例「0722 6」）は、耳標ID10桁の6〜9桁目と最後の1桁
// 画面から読み取った農家は「07226」（4桁＋最後の1桁）しか分からないことがある
function key4(id){ id=digits(id); return id.length===10? id.slice(5,9) : (id.length===5? id.slice(0,4) : ''); }

function earHTML(id){
  id=digits(id);
  if(id.length===5) return '<span class="key">'+id.slice(0,4)+'</span> <span class="dim">'+id.slice(4)+'</span>';
  if(id.length!==10) return esc(id||'（耳標なし）');
  return '<span class="dim">'+id.slice(0,5)+'</span> <span class="key">'+id.slice(5,9)+'</span> <span class="dim">'+id.slice(9)+'</span>';
}

function parseDate(s){ var m=String(s||'').match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/); return m? new Date(+m[1],+m[2]-1,+m[3]) : null; }
function months(s){
  var d=parseDate(s); if(!d) return '';
  var n=new Date(), m=(n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth());
  if(n.getDate()<d.getDate()) m--;
  return m;
}
function daysUntil(s){ var d=parseDate(s); if(!d) return null; var n=new Date(); n.setHours(0,0,0,0); return Math.round((d-n)/86400000); }

function v(c,k){ var x=c[k]; return (x==null||x===''||x==='-')? '' : x; }

function field(label,val,sub){
  if(val===''||val==null) val='—';
  return '<div class="f"><span class="k">'+esc(label)+'</span><span class="v">'+esc(val)+(sub?'<small>'+esc(sub)+'</small>':'')+'</span></div>';
}

function tags(c){
  var t=[];
  // 前回（先週）取ったCSVと比べた変化
  if(c._new) t.push(['new','今回新しく入った牛']);
  if(c._calv!=null) t.push(['new','分娩日が更新（前回 '+(c._calv||'なし')+'）']);
  var sex=v(c,'性別'), breed=v(c,'品種'), parity=v(c,'産次');
  if(breed) t.push(['',breed+(sex?' '+sex:'')]);
  t.push(['', parity? parity+'産' : '未経産']);
  var preg=String(c['妊鑑結果']||''); // 「-」は空と同じ扱いにしない（妊鑑マイナスの印なので）
  if(preg==='+'||preg==='＋') t.push(['preg','妊娠']);
  else if(preg==='-'||preg==='－') t.push(['warn','妊鑑マイナス']);
  else if(v(c,'最新授精日')) t.push(['','授精中']);
  var due=daysUntil(v(c,'分娩予定日'));
  if(due!=null && due>=0 && due<=30) t.push(['warn','分娩まで'+due+'日']);
  var scc=parseFloat(v(c,'体細胞数'));
  if(scc>=300) t.push(['bad','体細胞 '+scc]);
  return t.map(function(x){ return '<span class="tag '+x[0]+'">'+esc(x[1])+'</span>'; }).join('');
}

function cowHTML(c){
  var f=DATA.farms[c._f]||{};
  var age=months(v(c,'生年月日'));
  var html='<div class="cow">'
    +'<div class="cow-head"><span class="ear">'+earHTML(c['耳標ID'])+'</span>'
    +'<span class="name">'+esc(v(c,'名号')||'（名号なし）')+'</span>'
    +'<span class="farm">'+esc(f.name||f.code||'')+'</span></div>'
    +'<div class="tags">'+tags(c)+'</div>'
    +'<div class="grid">'
    +field('生年月日',v(c,'生年月日'),age!==''? age+'か月' : '')
    +field('最新分娩日',v(c,'最新分娩日'),v(c,'分娩後日数')&&v(c,'最新分娩日')? '分娩後'+v(c,'分娩後日数')+'日' : '')
    +field('最新授精日',v(c,'最新授精日'),v(c,'授精後日数')? '授精後'+v(c,'授精後日数')+'日' : '')
    +field('授精回数',v(c,'授精回数'),v(c,'授精略号'))
    +field('妊鑑日',v(c,'妊鑑日'),v(c,'妊鑑結果'))
    +field('分娩予定日',v(c,'分娩予定日'))
    +field('空胎日数',v(c,'空胎日数'))
    +field('初回授精月齢',v(c,'初回授精月齢'))
    +field('検定乳量',v(c,'検定乳量'),v(c,'検定乳量')?'kg':'')
    +field('体細胞数',v(c,'体細胞数'),v(c,'体細胞数')?'千/mL':'')
    +field('父牛',v(c,'父牛名'))
    +field('母の父',v(c,'母の父の名号'))
    +field('母の母の父',v(c,'母の母の父の名号'))
    +field('登録番号',v(c,'登録番号'))
    +field('BVD',v(c,'BVD'))
    +'</div>'
    +'<details><summary>CSVの全項目</summary><table>'
    +DATA.header.map(function(k){ return '<tr><td>'+esc(k)+'</td><td>'+esc(c[k])+'</td></tr>'; }).join('')
    +'</table></details>'
    +'</div>';
  return html;
}

var MAX=50; // 一度に出すのは50頭まで（それ以上は絞ってもらう）

// 候補の一覧（4桁が同じ牛が何戸かにいるとき）。農家名を大きく出して選んでもらう。
function candHTML(c,i){
  var f=DATA.farms[c._f]||{};
  var age=months(v(c,'生年月日'));
  return '<button class="cand" data-i="'+i+'">'
    +'<span class="cand-farm">'+esc(f.name||f.code||'')+'</span>'
    +'<span class="cand-ear">'+earHTML(c['耳標ID'])+'</span>'
    +'<span class="cand-sub">'+esc(v(c,'名号')||'（名号なし）')+'　'+esc(v(c,'品種'))+'　'+esc(v(c,'生年月日'))+(age!==''?'（'+age+'か月）':'')+'</span>'
    +'<span class="tags">'+tags(c)+'</span>'
    +'</button>';
}

var HITS=[];
function showCow(i){
  $('count').innerHTML = HITS.length>1? '<button class="back" id="back">← 候補に戻る（'+HITS.length+'頭）</button>' : '';
  $('list').innerHTML = cowHTML(HITS[i]);
  var b=$('back'); if(b) b.onclick=function(){ render(); };
}

function render(){
  var q=$('q').value.normalize('NFKC').trim(), farm=$('farmSel').value;
  if(HITS.length===1){ showCow(0); return; }
  $('count').textContent = HITS.length? HITS.length+' 頭あります。農家を選んでください'+(HITS.length>MAX?'（はじめの'+MAX+'頭を表示）':'') : '';
  $('list').innerHTML = HITS.length
    ? '<div class="cands">'+HITS.slice(0,MAX).map(candHTML).join('')+'</div>'
    : (q? '<div class="empty">「'+esc(q)+'」の牛は見つかりません'+(farm!==''?'（農家を「全農家」に戻すと見つかるかもしれません）':'')+'</div>'
        : '<div class="empty">耳標の4桁を入れてください</div>');
}

function search(){
  var q=$('q').value.normalize('NFKC').trim(), farm=$('farmSel').value;
  var d=digits(q), hits=[];
  HITS=[];
  if(!q){ render(); return; }
  DATA.cows.forEach(function(c){
    if(farm!=='' && String(c._f)!==farm) return;
    var id=digits(c['耳標ID']);
    var ok;
    if(d && d===q){
      if(d.length===4) ok = key4(id)===d;                 // 牛番号の4桁
      else if(d.length===5) ok = id.slice(-5)===d;        // 4桁＋最後の1桁
      else ok = id.indexOf(d)>=0;                          // 10桁や、その一部
    }else{
      ok = String(c['名号']||'').indexOf(q)>=0 || String(c['登録番号']||'').indexOf(q)>=0;
    }
    if(ok) hits.push(c);
  });
  // 候補は農家名の順に並べる
  hits.sort(function(a,b){ return ((DATA.farms[a._f]||{}).name||'').localeCompare((DATA.farms[b._f]||{}).name||'','ja'); });
  HITS=hits;
  render();
}

// ---------- ひな形のまま開いたとき：手元のCSVを選んでその場で試せるようにする ----------
// 本番の牛検索.html にはデータが入っているので、ここは使われない。

function splitCsvLine(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(q){ if(c==='"'&&line[i+1]==='"'){cur+='"';i++;} else if(c==='"') q=false; else cur+=c; }
    else if(c==='"') q=true; else if(c===','){ out.push(cur); cur=''; } else cur+=c;
  }
  out.push(cur); return out;
}
function kana(s){ return String(s||'').normalize('NFKC').replace(/([ァ-ヶー])-/g,'$1ー').replace(/([ァ-ヶー])-/g,'$1ー').trim(); }

function showPicker(){
  $('farms').hidden=true;
  $('list').innerHTML='<div class="empty picker">'
    +'<p><b>これは牛検索の「ひな形」です（まだデータが入っていません）。</b></p>'
    +'<p>ふだんは「今すぐ取る.bat」か毎週の自動取得のあとに、保存先フォルダにできる <b>牛検索.html</b> を開きます。</p>'
    +'<p style="margin-top:14px">今すぐ試すなら、TAF から落とした牛一覧のCSVを選んでください（何戸ぶんでも一度に選べます）。<br>CSVはこのPCの中で読むだけで、どこにも送りません。</p>'
    +'<label class="pick">CSVを選ぶ<input type="file" id="pick" accept=".csv" multiple hidden></label>'
    +'<p class="hint" style="margin-top:8px">この画面にCSVをドラッグしても読めます</p></div>';
  $('pick').addEventListener('change',function(){ loadFiles(this.files); });
  document.addEventListener('dragover',function(e){ e.preventDefault(); });
  document.addEventListener('drop',function(e){ e.preventDefault(); if(!DATA) loadFiles(e.dataTransfer.files); });
}

function loadFiles(files){
  files=[].slice.call(files||[]).filter(function(f){ return /\.csv$/i.test(f.name); });
  if(!files.length) return;
  Promise.all(files.map(function(f){ return f.arrayBuffer().then(function(b){ return {f:f,b:b}; }); })).then(function(list){
    var farms=[],cows=[],header=null;
    list.forEach(function(x){
      var u8=new Uint8Array(x.b), bom=u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF;
      var text=bom? new TextDecoder('utf-8').decode(u8.subarray(3)) : new TextDecoder('shift_jis').decode(x.b);
      var rows=text.split(/\r?\n/).filter(function(l){ return l.trim(); }).map(splitCsvLine);
      if(rows.length<1) return;
      var h=rows[0].map(function(s){ return s.trim(); });
      if(h.indexOf('耳標ID')<0) return; // 牛一覧のCSVではない
      if(!header||h.length>header.length) header=h;
      // TAF が付けるファイル名（1011_00007085_…）から生産者コードを取る。農家名は分からないのでコードで出す
      var m=x.f.name.match(/_(\d{8})_/);
      var code=m? m[1] : '';
      var fi=farms.push({code:code,name:code? '生産者 '+code : x.f.name,date:new Date(x.f.lastModified).toISOString().slice(0,10),n:rows.length-1})-1;
      rows.slice(1).forEach(function(r){
        var o={_f:fi}; h.forEach(function(k,i){ o[k]=kana(r[i]); }); cows.push(o);
      });
    });
    if(!cows.length){ alert('牛一覧のCSVが読めませんでした（見出しに「耳標ID」がありません）'); return; }
    DATA={built:new Date().toISOString(),header:header,farms:farms,cows:cows};
    init();
    $('q').focus();
  });
}

function init(){
  if(!DATA){ showPicker(); return; }
  var built=new Date(DATA.built);
  var oldest=DATA.farms.reduce(function(a,f){ return !a||f.date<a? f.date : a; },'');
  var age=Math.floor((Date.now()-new Date(oldest).getTime())/86400000);
  $('fresh').textContent='データ：'+oldest.replace(/-/g,'/')+' 取得'+(age>10?'（'+age+'日前・古くなっています）':'')+'　'+DATA.farms.length+'戸・'+DATA.cows.length+'頭';
  if(age>10) $('fresh').className='fresh old';

  var sel=$('farmSel');
  DATA.farms.map(function(f,i){ return [f,i]; })
    .sort(function(a,b){ return (a[0].name||'').localeCompare(b[0].name||'','ja'); })
    .forEach(function(p){ var o=document.createElement('option'); o.value=p[1]; o.textContent=(p[0].name||p[0].code)+'（'+p[0].n+'頭）'; sel.appendChild(o); });

  $('farms').hidden=false;
  $('farms').innerHTML='<summary>取り込んだ農家と取得日</summary><table>'
    +DATA.farms.map(function(f){ return '<tr><td>'+esc(f.code)+'</td><td>'+esc(f.name)+'</td><td>'+esc(f.n)+'頭</td><td>'+esc(f.date)+'</td></tr>'; }).join('')
    +'</table>';

  $('q').addEventListener('input',search);
  $('list').addEventListener('click',function(e){ var b=e.target.closest('.cand'); if(b) showCow(+b.dataset.i); });
  // 候補が出ているときに Enter を押すと、いちばん上の候補を開く
  $('q').addEventListener('keydown',function(e){ if(e.key==='Enter' && HITS.length>1 && document.querySelector('.cand')) showCow(0); });
  sel.addEventListener('change',function(){ search(); $('q').focus(); });
  // Esc で消して、次の牛をすぐ打てるように
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ $('q').value=''; search(); $('q').focus(); } });
  search();
}
init();
</script>
</body>
</html>
